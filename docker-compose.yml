services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campusflow
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: campusflow
    ports:
      - "5432:5432"
    volumes:
      - campusflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusflow -d campusflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://campusflow:campusflow@postgres:5432/campusflow
      CORS_ORIGINS: http://localhost:5173
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  campusflow_pg:
